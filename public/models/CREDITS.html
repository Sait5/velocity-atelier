<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velocity Atelier — записи об источниках</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:radial-gradient(ellipse 80% 40% at 50% 0%,#18231a 0%,#0b0f0c 60%) fixed,#0b0f0c;color:#dce2dc;font:14px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:auto;padding:40px 30px 80px}
a{color:#c9db97;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.back{font-size:12px}
h1{font-size:clamp(26px,4vw,34px);font-weight:600;letter-spacing:-.5px;line-height:1.2;margin:22px 0 18px}
h2{font-size:22px;font-weight:600;margin:42px 0 14px;padding-top:26px;border-top:1px solid #ffffff14}
h3{font-size:16px;font-weight:600;margin:28px 0 8px}
p,li{color:#aebbb1;margin:0 0 12px}
ul{padding-left:20px;margin:0 0 12px}
li{margin:0 0 6px}
strong{color:#dce2dc;font-weight:600}
code{font:12px/1.5 ui-monospace,Consolas,monospace;background:#ffffff0d;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
@media(max-width:600px){main{padding:28px 16px 60px}}
</style>
</head>
<body>
<main>
<a class="back" href="/legal">← Лицензии и авторы · Credits &amp; licences</a>
<article id="record"><noscript><p><a href="CREDITS.md">CREDITS.md</a></p></noscript></article>
</main>
<script>
// Shows the CREDITS.md next to this page as a readable page, so the record and the page never drift apart.
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
// a sibling record opens as its own readable page
const link=(url,label)=>{const tail=url.match(/[.,;:]+$/)?.[0]??'';url=url.slice(0,url.length-tail.length);return `<a href="${url.replace(/^(\/\w+\/CREDITS)\.md$/,'$1.html')}" target="_blank" rel="noopener">${label??url}</a>${tail}`}
const inline=text=>text.split('`').map((part,i)=>{
 if(i%2)return `<code>${esc(part)}</code>`
 const links=[]
 part=part.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,label,url)=>`\u0000${links.push(link(url,esc(label)))-1}\u0000`)
 part=esc(part).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(https?:\/\/[^\s<]+|\/(?:models|textures|audio)\/[\w./-]+\.md)/g,url=>link(url))
 return part.replace(/\u0000(\d+)\u0000/g,(_,n)=>links[n])
}).join('')
const render=md=>{
 const out=[];let para=[],list=null
 const flush=()=>{if(para.length)out.push(`<p>${para.map(inline).join('<br>')}</p>`);para=[];if(list)out.push(`<ul>${list.map(item=>`<li>${inline(item)}</li>`).join('')}</ul>`);list=null}
 for(const line of md.replace(/\r/g,'').split('\n')){
  const heading=line.match(/^(#{1,3})\s+(.*)$/)
  if(heading){flush();out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);if(heading[1].length===1)document.title=heading[2];continue}
  if(!line.trim()){flush();continue}
  if(/^- /.test(line)){if(para.length){const keep=list;list=null;flush();list=keep}(list??=[]).push(line.slice(2));continue}
  if(list&&/^\s+\S/.test(line)){list[list.length-1]+=' '+line.trim();continue}
  if(list)flush()
  para.push(line)
 }
 flush();return out.join('\n')
}
fetch('CREDITS.md',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(md=>{document.getElementById('record').innerHTML=render(md)}).catch(()=>{document.getElementById('record').innerHTML='<p><a href="CREDITS.md">CREDITS.md</a></p>'})
</script>
</body>
</html>
